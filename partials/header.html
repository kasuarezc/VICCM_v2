<style>
      /* ---------- CONTENEDOR DEL BUSCADOR ---------- */
 .search-wrapper {
    position: relative;
  }

  .search-shell {
    display: flex;
    align-items: center;
    height: 50px;
    width: 50px;                 /* estado inicial: solo botón */
    background: #8B3A2A;
    border-radius: 20px;
    overflow: hidden;
    transition: width 0.35s cubic-bezier(.4,0,.2,1),
                background-color 0.35s ease;
    cursor: pointer;
  }

  .search-shell.open {
    width: 260px;                /* estado final: barra expandida */
    background: #8B3A2A;
    border: 0.5px solid#8B3A2A;
    cursor: default;
  }

  .search-icon-btn {
    flex: none;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    cursor: pointer;
    color: #fff;
    transition: color 0.25s ease;
  }

  .search-shell.open .search-icon-btn {
    color: #FAF0D7;
  }

  .search-shell input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    font-size: 14px;
    padding-right: 12px;
    opacity: 0;
    transition: opacity 0.25s ease 0.1s;
  }

  .search-shell.open input {
    opacity: 1;
  }

  /* ---------- RESULTADOS FLOTANTES ---------- */
  /* position:absolute respecto al wrapper -> no empuja al header */
  .search-results {
    position: absolute;
    top: 48px;
    right: 0;
    width: 300px;
    max-height: 320px;
    overflow-y: auto;
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 10px;
    box-shadow: 0 10px 30px #5f6b66;
    opacity: 0;
    transform: translateY(-6px);
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 50;
  }

  .search-results.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .search-results ul { list-style: none; margin: 0; padding: 6px; }

  .search-results li {
    padding: 9px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }

  .search-results li:hover { background: #f1f5f9; }

  .search-results li .tag {
    font-size: 10px;
    font-weight: 700;
    color: blue;
    background: #eef2ff;
    padding: 1px 6px;
    border-radius: 4px;
    flex: none;
  }

  .search-results .empty {
    padding: 14px 12px;
    font-size: 13px;
    color: #0b3b2f;
  }
  /* ---------- CONTENIDO DE EJEMPLO ---------- */
 
</style>

<div class="search-wrapper">
    <div class="search-shell" id="searchShell">

        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
      <input type="text" id="searchInput" placeholder="Buscar en la página...">
    </div>

    <div class="search-results" id="searchResults">
      <ul id="resultsList"></ul>
    </div>
  </div>
  
      </nav>
    </div>
  </div>
