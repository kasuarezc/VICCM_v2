<!-- ===================================================== -->
<!--                  SEARCH MODAL                          -->
<!-- ===================================================== -->

<div class="search-overlay" id="searchOverlay">

    <div class="search-modal">

        <div class="search-header">

            <i class="fas fa-search"></i>

            <input
                type="text"
                id="searchInput"
                class="search-input"
                placeholder="Buscar noticias, simposios, cursos..."
                autocomplete="off"
            >

            <button
                class="close-search"
                id="closeSearch"
                type="button"
            >
                <i class="fas fa-times"></i>
            </button>

        </div>

        <div
            class="search-results"
            id="searchResults"
        >

            <div class="no-results">

                <i class="fas fa-search fa-2x"></i>

                <p>

                    Escriba para comenzar la búsqueda.

                </p>

            </div>

        </div>

        <div class="search-footer">

            <strong>Consejos</strong>

            • Presione <kbd>Ctrl</kbd> + <kbd>K</kbd> para abrir el buscador.

            • Presione <kbd>ESC</kbd> para cerrar.

        </div>

    </div>

</div>
